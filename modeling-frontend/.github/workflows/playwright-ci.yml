name: Playwright E2E CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend deps
        run: npm ci --prefix modeling-backend

      - name: Install frontend deps
        run: npm ci --prefix modeling-frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start backend
        run: npm --prefix modeling-backend run dev &

      - name: Start frontend
        run: npm --prefix modeling-frontend run dev &

      - name: Wait for services
        run: npx wait-on http://localhost:3000 http://127.0.0.1:4000 -t 60000

      - name: Run auth smoke test
        run: npx playwright test tests/register.smoke.spec.ts --project=chromium --workers=1 || true

      - name: Run full Playwright suite
        run: npx playwright test --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/**
